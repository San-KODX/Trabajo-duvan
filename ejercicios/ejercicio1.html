<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1: Sumar</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <a href="../index.html">&larr; Volver al inicio</a>
        <h1>Ejercicio 1: Sumar</h1>
        <p>Evento click con una función anónima.</p>
    </header>

    <main>
        <form id="formEjercicio1" novalidate>
            <label for="numero1">Primer número:</label>
            <input type="number" id="numero1" step="any">

            <label for="numero2">Segundo número:</label>
            <input type="number" id="numero2" step="any">

            <div class="botones">
                <input type="button" id="btnSumar" value="Sumar">
                <input type="reset" value="Limpiar">
            </div>
        </form>

        <!-- Aquí se mostrará el resultado o el error -->
        <p id="resultado" class="mensaje"></p>
    </main>

    <script src="../js/ejercicio1.js"></script>
</body>
</html>
